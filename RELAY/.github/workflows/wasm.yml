# Copy to .github/workflows/wasm.yml. Builds the grammar's WebAssembly module and runs the
# grammar's checks on it: the corpus tests through the Wasm build, and the JuliaSyntax check
# (tree-sitter-julia.wasm vs Julia's own parser, juliasyntax.wasm), with no Julia install.
name: Wasm

on:
  push:
    branches: [topiary-julia]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
      - name: Install dev dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build tree-sitter-julia.wasm
        run: tree-sitter build --wasm -o tree-sitter-julia.wasm
      - name: The committed wasm is up to date
        run: git diff --exit-code --stat -- tree-sitter-julia.wasm || echo "::warning::tree-sitter-julia.wasm differs from a fresh build; rebuild and commit it"
      - name: Corpus tests on the Wasm build
        run: tree-sitter test --wasm
      - name: JuliaSyntax check (Julia's own parser, in Wasm, as the oracle)
        run: node test/juliasyntax/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-julia.wasm
          path: tree-sitter-julia.wasm
